<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Baki Grup — taslaklar</title>
<style>
:root{--paper:#F3F0E9;--ink:#161513;--line:#cfc9bc;--copper:#8F5524}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
main{width:100%;max-width:440px;padding:32px 20px}
img{width:120px;height:auto;display:block;margin:0 auto 32px}
nav{border-top:1px solid var(--ink)}
a{display:flex;justify-content:space-between;align-items:baseline;padding:20px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;font-size:26px}
a span{font:13px ui-monospace,Menlo,monospace;color:var(--copper)}
a:hover,a:focus-visible{color:var(--copper)}
a:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
</style>
</head>
<body>
<main>
<img src="assets/logo/baki-grup.png" alt="Baki Grup İnşaat">
<nav>
<a href="tema1/" target="_blank" rel="noopener">Kesit <span>01 ↗</span></a>
<a href="tema2/" target="_blank" rel="noopener">Yalama Işık <span>02 ↗</span></a>
<a href="tema3/" target="_blank" rel="noopener">Metraj <span>03 ↗</span></a>
</nav>
</main>
</body>
</html>
